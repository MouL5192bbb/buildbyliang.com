<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- 左侧色块 -->
  <rect x="0" y="0" width="48" height="630" fill="#00dc82"/>

  <!-- Logo -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="72" height="72" rx="14" fill="#0a0a0a"/>
    <text x="36" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800"
          fill="#00dc82" text-anchor="middle">L</text>
  </g>

  <!-- 域名 -->
  <text x="120" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700"
        fill="#0a0a0a">buildbyliang</text>

  <!-- 副标题 -->
  <text x="120" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500"
        fill="#525252">AI Infra · Embedded · High-Performance C++</text>

  <!-- 标签 -->
  <g transform="translate(120, 440)">
    <rect x="0" y="0" width="140" height="44" rx="22" fill="#f5f5f5"/>
    <text x="70" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500"
          fill="#404040" text-anchor="middle">C++ Engineer</text>
  </g>
  <g transform="translate(280, 440)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#f5f5f5"/>
    <text x="90" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500"
          fill="#404040" text-anchor="middle">Open Source</text>
  </g>
  <g transform="translate(480, 440)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#f5f5f5"/>
    <text x="90" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500"
          fill="#404040" text-anchor="middle">Indie Hacker</text>
  </g>
</svg>
