name: CI & Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 第一阶段：代码质量检查（PR 必须通过）
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{astro,ts,tsx,js,jsx,md,mdx}"

      - name: Astro check (TypeScript)
        run: npm run check

  # 第二阶段：构建验证（PR 必须通过）
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -d dist || (echo "❌ dist/ not found" && exit 1)
          test -f dist/index.html || (echo "❌ index.html not generated" && exit 1)
          test -f dist/rss.xml || (echo "❌ rss.xml not generated" && exit 1)
          test -f dist/en/rss.xml || (echo "❌ en/rss.xml not generated" && exit 1)
          echo "✅ All build artifacts present"

  # 第三阶段：部署到生产环境（仅 main 分支）
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: buildbyliang-com
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          productionBranch: main
