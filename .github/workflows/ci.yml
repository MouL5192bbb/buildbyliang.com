name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 代码质量检查（PR 必须通过）
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{astro,ts,tsx,js,jsx,md,mdx}"

      - name: Astro check (TypeScript)
        run: npm run check

  # 构建验证（PR 必须通过）
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -d dist || (echo "❌ dist/ not found" && exit 1)
          test -f dist/index.html || (echo "❌ index.html not generated" && exit 1)
          test -f dist/rss.xml || (echo "❌ rss.xml not generated" && exit 1)
          test -f dist/en/rss.xml || (echo "❌ en/rss.xml not generated" && exit 1)
          echo "✅ All build artifacts present"
